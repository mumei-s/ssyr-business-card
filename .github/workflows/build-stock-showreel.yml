name: Build and publish real welding & construction video
on:
  push:
    branches: [main]
    paths:
      - tools/build_stock_showreel.py
      - .github/workflows/build-stock-showreel.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font and video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: Produce real moving welding/construction showreel
        run: python tools/build_stock_showreel.py
      - name: Validate dimensions, duration and no audio
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/showreel-demo.mp4
          test $(stat -c%s assets/showreel-demo.mp4) -gt 200000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of csv=p=0 assets/showreel-demo.mp4
          ! ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 assets/showreel-demo.mp4 | grep -q .
      - name: Commit new footage to the public website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showreel-demo.mp4
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Publish licensed welding and construction motion footage (no QR or private info)"
          git push
