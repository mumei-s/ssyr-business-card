name: Check actual QR scan results and site structure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QR decoding/rendering libraries
        run: python -m pip install --disable-pip-version-check cairosvg opencv-python-headless
      - name: Scan all three QR SVGs and validate business card content
        run: python tools/verify_site.py
