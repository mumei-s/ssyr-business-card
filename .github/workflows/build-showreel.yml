name: Generate 15-second S's-YR sample video
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-showreel.yml'
      - 'tools/build_showreel.py'
permissions:
  contents: write
jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare video-rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check Pillow cairosvg
      - name: Render a small silent 15-second MP4 from approved illustration samples
        run: python tools/build_showreel.py
      - name: Commit generated video to the GitHub Pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/showreel-demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Add silent 15-second digital media preview'
            git push origin HEAD:main
          fi
