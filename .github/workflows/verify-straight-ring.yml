name: Verify published STRAIGHT RING
on:
  push:
    branches: [qa/straight-ring-677750d]
permissions:
  contents: read
jobs:
  play:
    strategy:
      fail-fast: false
      matrix:
        check: [mobile_touch, five_bouts]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python tools/ring-qa/${{ matrix.check }}.py https://mumei-s.github.io/ssyr-business-card/shinji/games/straight-ring/index.html "$(command -v google-chrome)"
