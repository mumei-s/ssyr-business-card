<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101417"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://slamzhgsawfnmwlejgqp.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><title>チャット | S's-YR</title><link rel="manifest" href="./manifest.webmanifest?v=badge-2"><link rel="apple-touch-icon" href="./logo-spectrum.webp"><link rel="stylesheet" href="./notices.css?v=chat-1"><script src="./notice-common.js?v=chat-1" defer></script><script src="./notices.js?v=chat-clear-1" defer></script>

  <meta property="og:site_name" content="S's-YR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="S's-YR | 連絡室">
  <meta property="og:description" content="S's-YRのデジタル名刺・ご連絡">
  <meta property="og:image" content="https://mumei-s.github.io/ssyr-business-card/shinji/logo-silver.webp?v=share-2">

</head><body>
<main class="sheet"><header class="masthead"><a class="home" href="./">← 名刺へ</a><div class="signature"><img src="./logo-silver.webp" alt="" width="52" height="52"><div><span class="eyebrow">PRIVATE CORRESPONDENCE</span><h1>S's-YR チャット</h1><p>メールアドレス不要のチャット</p></div></div></header>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  <section class="panel compact-panel" id="claim-panel" hidden>
    <h2>はじめまして</h2>
    <p>メールアドレスや会員登録は不要です。そのままメッセージを送れます。</p>
    <form id="claim-form">
      <label>お名前（任意）<input id="visitor-name" autocomplete="nickname" maxlength="100" placeholder="ゲスト"></label>
      <details id="invite-options" class="auth-options"><summary>個別の連絡リンクをお持ちの方</summary><label id="invite-label">連絡リンク<input id="invite" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="300"></label></details>
      <label class="check" hidden><input type="checkbox" id="claim-news">MUUMEIの正式公開案内も受け取る（任意）</label>
      <button type="submit" id="claim-button" class="subtle">チャットを開く</button>
    </form>
  </section>
  <section class="panel chat-panel" id="messages" hidden>
    <div class="between"><h2>チャット <span id="chat-unread" class="state" hidden></span></h2><button type="button" id="refresh">更新</button></div>
    <div id="message-list" class="chat-messages" role="log" aria-live="polite"></div>
    <form id="chat-form" class="chat-composer">
      <label class="sr-only" for="chat-body">メッセージ</label>
      <textarea id="chat-body" rows="3" maxlength="2000" placeholder="メッセージを入力…" required></textarea>
      <button type="submit" id="chat-send" class="primary">チャット送信</button>
    </form>
    <p class="muted">このブラウザに会話を保存するための端末情報を保存します。</p>
  </section>
  <section class="panel compact-panel" id="settings-panel" hidden>
    <div class="between"><h2 id="recipient-name">通知</h2><span class="state" id="notice-state">確認中</span></div>
    <p>新しい返信をスマートフォンで受け取る。</p>
    <p id="device-guide" hidden></p>
    <div class="actions"><button type="button" id="enable" class="primary" disabled>通知をONにする</button><button type="button" id="stop" disabled>通知をOFF</button></div>
    <details class="auth-options"><summary>通知・端末の設定</summary>
      <button type="button" id="test" disabled>テスト通知</button>
      <label class="check"><input type="checkbox" id="news">MUUMEIの正式公開のお知らせも受け取る（任意）</label>
      <button type="button" class="subtle" id="disconnect">この端末の連絡登録を解除</button>
    </details>
  </section>
  <footer><a href="mailto:ss526s-syr@yahoo.co.jp">通常のメールを送る</a><a href="./">デジタル名刺に戻る</a></footer>
</main></body></html>
