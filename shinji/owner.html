<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101417"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://slamzhgsawfnmwlejgqp.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><title>管理者専用電話帳 | S's-YR</title><link rel="apple-touch-icon" href="./logo-spectrum.webp"><link rel="stylesheet" href="./notices.css?v=2"><script src="./notice-common.js?v=3" defer></script><script src="./owner.js?v=share-2" defer></script>
  <link rel="icon" type="image/png" sizes="96x96" href="./brand-96.png?v=share-2">
  <link rel="shortcut icon" href="./brand-96.png?v=share-2" type="image/png">
  <meta property="og:site_name" content="S's-YR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="S's-YR | 管理者専用">
  <meta property="og:description" content="S's-YRのデジタル名刺・ご連絡">
  <meta property="og:image" content="https://mumei-s.github.io/ssyr-business-card/shinji/logo-silver.webp?v=share-2">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="256">
  <meta property="og:image:alt" content="S's-YR 銀白ロゴ">
  <meta property="og:url" content="https://mumei-s.github.io/ssyr-business-card/shinji/owner.html">
</head><body>
<main class="sheet owner-sheet"><header class="masthead"><a class="home" href="./">← 名刺へ</a><div class="signature"><img src="./logo-silver.webp" alt="" width="52" height="52"><div><span class="eyebrow">OWNER / CONTACTS</span><h1>S's-YR 電話帳</h1><p>管理者専用</p></div></div></header>
  <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  <section class="panel" id="login-panel">
    <h2>管理者ログイン</h2>
    <p class="auth-intro">S's-YR電話帳専用のパスワードでログインします。</p>
    <form id="login-form">
      <label>電話帳専用パスワード<input id="login-password" type="password" autocomplete="current-password" required minlength="12" maxlength="72"></label>
      <label class="check"><input id="show-login-password" type="checkbox">パスワードを表示</label>
      <button class="primary" type="submit">ログイン</button>
    </form>
    <button id="show-setup" type="button" class="subtle">初めて利用する方・初回設定</button>
  </section>
  <section class="panel" id="setup-panel" hidden>
    <h2>電話帳専用パスワードを設定</h2>
    <p class="auth-intro">この設定はS's-YR電話帳専用です。MUUMEIのアカウントには影響しません。</p>
    <form id="setup-form">
      <label id="setup-code-label">初回設定コード<input id="setup-code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" required minlength="20" maxlength="20"></label>
      <label>新しいパスワード（12文字以上）<input id="setup-password" type="password" autocomplete="new-password" required minlength="12" maxlength="72"></label>
      <label>確認のため再入力<input id="setup-confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="72"></label>
      <label class="check"><input id="show-setup-password" type="checkbox">パスワードを表示</label>
      <button class="primary" type="submit">設定して電話帳を開く</button>
      <button id="back-to-login" type="button">ログイン画面に戻る</button>
    </form>
  </section>
  <div id="owner-console" hidden>
    <section class="panel"><div class="between"><h2>連絡先一覧 <span id="contact-count"></span></h2><button id="logout" type="button">ログアウト</button></div>
      <div class="actions"><button id="reload" type="button">更新</button><button id="new-contact" type="button" class="primary">＋ 新規連絡先</button></div>
      <label>検索<input id="search" type="search" placeholder="名前・メール・電話番号"></label><div id="contacts"></div>
    </section>
    <section class="panel" id="edit-panel"><h2 id="edit-title">連絡先を追加</h2>
      <form id="contact-form"><label>名前<input id="contact-name" required maxlength="100" autocomplete="off"></label><label>メール<input id="contact-email" type="email" maxlength="254" autocomplete="off"></label><label>電話番号<input id="contact-phone" type="tel" maxlength="50" autocomplete="off"></label><label>メモ<textarea id="contact-memo" maxlength="500" rows="2"></textarea></label><button class="primary" type="submit">保存する</button></form>
    </section>
    <section class="panel" id="invite-panel" hidden><h2>受け取り登録の招待</h2><p>相手にこのリンクを渡してください。7日間・1回限り有効です。</p><label>招待リンク<input id="invite-link" readonly></label><div class="actions"><button id="copy-invite" type="button" class="primary">コピーする</button><button id="share-invite" type="button">共有する</button><a class="button" id="open-invite" href="./notices.html" target="_blank" rel="noopener noreferrer">この端末で開く</a></div></section>
    <section class="panel" id="selected-panel" hidden>
      <div class="between"><h2 id="selected-name"></h2><span class="state" id="selected-state"></span></div>
      <div class="actions"><button id="reissue" type="button">同じ相手へ招待を再発行</button><button id="revoke" type="button">端末登録を解除</button></div>
      <div id="send-panel" hidden><h3>通知付きの連絡を送る</h3><p>ここから送った連絡は、相手の名刺の連絡室に届きます。</p><form id="send-form"><label>タイトル<input id="message-title" required maxlength="80"></label><label>本文<textarea id="message-body" rows="5" required maxlength="2000"></textarea></label><button class="primary" type="submit">送信する</button></form></div>
      <div id="history-panel"><h3>送信履歴</h3><div id="history"></div><div class="actions"><button id="history-prev" type="button" disabled>新しい履歴</button><button id="history-next" type="button" disabled>古い履歴</button></div></div>
    </section>
    <section class="panel" id="muumei-panel"><h2>MUUMEI 正式公開案内</h2><p>希望者へ正式公開後に一度だけ配信します。</p><button type="button" id="muumei-send" disabled>希望者に案内を送る</button><p id="muumei-state"></p></section>
  </div><footer><a href="./">デジタル名刺に戻る</a></footer>
</main></body></html>
