<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101417">
  <meta name="robots" content="noindex,nofollow">
  <title>S's-YR（エスズ ワイアール）｜SHINJIの仕事名刺</title>
  <meta name="description" content="S's-YR（エスズ ワイアール）代表 SHINJI（しんじ）の仕事名刺。施工・業務支援、ポスティング、洗車、AI・デジタル制作のご相談はメールで。">
  <meta property="og:title" content="S's-YR ｜ SHINJIの仕事名刺">
  <meta property="og:description" content="エスズ ワイアールの仕事と作品、SHINJIの連絡先。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://mumei-s.github.io/ssyr-business-card/shinji/prism.webp">
  <meta property="og:image:alt" content="銀と青の光を映す、Sのガラス彫刻">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./personal.css?v=prism-field">
  <script src="./card.js?v=prism-field" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="mail" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></symbol>
    <symbol id="save" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
    <symbol id="light" viewBox="0 0 24 24"><path d="m12 2 7 10-7 10-7-10zM5 12h14m-7-10-2.5 10L12 22"/></symbol>
    <symbol id="film" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></symbol>
  </svg>
  <main class="studio">
    <section class="exhibit" aria-label="S's-YR　SHINJIの仕事名刺">
      <div class="card" id="card">
        <section class="face front" id="front" aria-label="名刺の表面・屋号と業務案内">
          <div class="identity">
            <h1 class="wordmark"><img src="../assets/lettering/wordmark.svg" width="361" height="89" alt="S's-YR"><span>エスズ ワイアール</span></h1>
            <div class="person"><small>代表</small><b lang="en">SHINJI</b><span>しんじ</span></div>
          </div>
          <div class="glass"><img src="./prism.webp" width="1100" height="1375" fetchpriority="high" alt="銀と青の光を映す、頭文字Sのガラス彫刻"></div>
          <div class="front-info">
            <div class="service-brief"><h2>業務案内</h2><p>工事・施工／現場支援<br>ポスティング／洗車<br>AI・デジタル制作</p></div>
            <div class="code"><a href="./works.html"><img src="./introduction-qr.svg" width="132" height="132" alt="事業紹介用QRコード"></a><button type="button" id="open-work-qr" aria-haspopup="dialog" aria-controls="work-dialog">事業紹介QRを拡大</button></div>
          </div>
        </section>
        <section class="face back" id="back" aria-label="名刺の裏面・連絡先" hidden>
          <div class="back-brand"><div class="wordmark"><img src="../assets/lettering/wordmark.svg" width="361" height="89" alt="S's-YR"><span>エスズ ワイアール</span></div><span class="back-kind">連絡先</span></div>
          <div class="signature"><span>代表</span><h2 lang="en">SHINJI</h2><p>しんじ</p></div>
          <div class="reverse-info"><div class="email"><span>メール</span><a href="mailto:ss526s-syr@yahoo.co.jp">ss526s-syr@<wbr>yahoo.co.jp</a></div>
            <div class="code"><a href="./contact.vcf" download="SHINJI.vcf"><img src="./contact-qr.svg" width="132" height="132" alt="連絡先登録用QRコード"></a><button type="button" id="open-qr" aria-haspopup="dialog" aria-controls="contact-dialog">連絡先QRを拡大</button></div>
          </div>
        </section>
      </div>
      <div class="switches">
        <div class="tabs" role="group" aria-label="名刺の表裏を切り替え"><button type="button" id="front-button" aria-pressed="true" aria-controls="front">表・業務案内</button><button type="button" id="back-button" aria-pressed="false" aria-controls="back">裏・連絡先</button></div>
        <button class="light" id="light-button" type="button" aria-pressed="false" aria-controls="front"><svg class="icon" aria-hidden="true"><use href="#light"/></svg>光を切替</button>
      </div>
    </section>
    <div class="directory">
      <section aria-labelledby="works-title">
        <h2 id="works-title">仕事と作品</h2>
        <p class="lede">地域のお店のチラシ配布から、車の手洗い、現場の施工やデジタル制作まで。</p>
        <div class="jobs">
          <a href="./works.html#posting"><img src="./work-posting.webp" width="1280" height="720" alt="ポストにチラシを配布する様子のイメージ" loading="lazy" decoding="async"><span>ポスティング</span></a>
          <a href="./works.html#carwash"><img src="./work-carwash.webp" width="1280" height="720" alt="泡を含ませたミットで車を手洗いする様子のイメージ" loading="lazy" decoding="async"><span>手洗い洗車</span></a>
        </div>
        <p class="photo-note">写真・映像は業務イメージです。</p>
        <div class="portfolio-links"><a href="./works.html"><span>仕事と作品をすべて見る</span></a><a href="./works.html#film"><svg class="icon" aria-hidden="true"><use href="#film"/></svg>紹介動画を見る</a></div>
      </section>
      <section class="contact" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">お問い合わせ</h2>
        <div class="contact-links"><a class="primary" href="mailto:ss526s-syr@yahoo.co.jp"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg>メールを送る</a><a href="./contact.vcf" download="SHINJI.vcf"><svg class="icon" aria-hidden="true"><use href="#save"/></svg>連絡先を保存</a></div>
      </section>
    </div>
  </main>
  <dialog id="contact-dialog" aria-labelledby="contact-qr-heading"><h2 id="contact-qr-heading">SHINJIの連絡先</h2><a href="./contact.vcf" download="SHINJI.vcf"><img src="./contact-qr.svg" width="240" height="240" alt="SHINJIの連絡先登録用QRコード"></a><a class="dialog-link" href="./contact.vcf" download="SHINJI.vcf">この端末に連絡先を保存</a><form method="dialog"><button autofocus>閉じる</button></form></dialog>
  <dialog id="work-dialog" aria-labelledby="work-qr-heading"><h2 id="work-qr-heading">S's-YRの業務案内</h2><a href="./works.html"><img src="./introduction-qr.svg" width="240" height="240" alt="S's-YRの事業紹介用QRコード"></a><a class="dialog-link" href="./works.html">この端末で仕事と作品を見る</a><form method="dialog"><button autofocus>閉じる</button></form></dialog>
</body>
</html>
