<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101417">
  <meta name="robots" content="noindex,nofollow">
  <title>S's-YR（エスズ ワイアール）｜SHINJIの仕事名刺</title>
  <meta name="description" content="S's-YR（エスズ ワイアール）代表 SHINJIの仕事名刺。施工・業務支援、ポスティング、洗車、AI・デジタル制作のご相談はメールで。">
  <meta property="og:title" content="S's-YR ｜ SHINJIの仕事名刺">
  <meta property="og:description" content="エスズ ワイアールの仕事と作品、SHINJIの連絡先。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://mumei-s.github.io/ssyr-business-card/shinji/shinji-lettering.webp">
  <meta property="og:image:alt" content="プラチナシルバーと群青の刷り模様に描いたSHINJIのレタリング">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./personal.css?v=foil-card-2">
  <link rel="stylesheet" href="../assets/contact-import.css?v=direct-4">
  <script src="../assets/contact-import.js?v=direct-4" defer data-contact-name="SHINJI" data-contact-edition="shinji"></script>
  <script src="./card.js?v=signature-role" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="mail" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></symbol>
    <symbol id="add-person" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20v-1.2a6.2 6.2 0 0 1 12.4 0V20M18.5 8v7M15 11.5h7"/></symbol>
    <symbol id="light" viewBox="0 0 24 24"><path d="m12 2 7 10-7 10-7-10zM5 12h14m-7-10-2.5 10L12 22"/></symbol>
    <symbol id="film" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></symbol>
  </svg>
  <main class="studio">
    <section class="exhibit" aria-label="S's-YR　SHINJIの仕事名刺">
      <div class="card" id="card">
        <section class="face contact-face" id="front" aria-label="名刺の表面・名前と連絡先">
          <div class="contact-brand">
            <h1 class="wordmark">
              <span class="brand-foil"><img src="../assets/lettering/wordmark.svg" width="361" height="89" alt="S's-YR" fetchpriority="high"></span>
              <span class="brand-kana">エスズ ワイアール</span>
            </h1>
            <div class="front-emblem" aria-hidden="true"><img src="./logo-silver.webp" width="256" height="256" alt=""></div>
          </div>
          <div class="contact-info">
            <div class="front-person"><strong class="role">代表</strong><b lang="en">SHINJI</b></div>
            <div class="email"><span>メール</span><a href="mailto:ss526s-syr@yahoo.co.jp">ss526s-syr@<wbr>yahoo.co.jp</a></div>
          </div>
        </section>
        <section class="face service-face" id="back" aria-label="名刺の裏面・業務案内" hidden>
          <div class="foil-logo" role="img" aria-label="S's-YRのカラーと銀白に輝くロゴ">
            <div class="logo-cycle" aria-hidden="true">
              <img class="logo-color" src="./logo-spectrum.webp" width="384" height="384" alt="" decoding="async">
              <img class="logo-silver" src="./logo-silver.webp" width="256" height="256" alt="" decoding="async">
            </div>
            <img class="logo-fixed" src="./logo-silver.webp" width="256" height="256" alt="" decoding="async" aria-hidden="true">
            <span class="logo-sweep" aria-hidden="true"></span>
            <span class="glint glint-one" aria-hidden="true"></span>
            <span class="glint glint-two" aria-hidden="true"></span>
            <span class="glint glint-three" aria-hidden="true"></span>
          </div>
          <div class="back-copy">
            <div class="back-brand">S's-YR<span>エスズ ワイアール</span></div>
            <div class="person"><strong class="role">代表</strong><b lang="en">SHINJI</b></div>
            <div class="service-brief"><p>工事・施工／現場支援<br>ポスティング／洗車<br>AI・デジタル制作</p></div>
            <a class="open-work" href="./works.html">事業内容を見る <span aria-hidden="true">↗</span></a>
          </div>
        </section>
      </div>
      <div class="switches">
        <div class="tabs" role="group" aria-label="名刺の表裏を切り替え"><button type="button" id="front-button" aria-pressed="true" aria-controls="front">表・連絡先</button><button type="button" id="back-button" aria-pressed="false" aria-controls="back">裏・業務案内</button></div>
        <button class="light" id="light-button" type="button" aria-pressed="false" aria-controls="card" title="光をゆっくり切替（裏面は銀白色へ／解除で色彩ループ）"><svg class="icon" aria-hidden="true"><use href="#light"/></svg>光を切替</button>
      </div>
    </section>
    <div class="directory">
      <section aria-labelledby="works-title">
        <h2 id="works-title">仕事と作品</h2>
        <p class="lede">地域のお店のチラシ配布から、車の手洗い、現場の施工やデジタル制作まで。</p>
        <div class="jobs">
          <a href="./works.html#posting"><img src="./work-posting.webp" width="1280" height="720" alt="ポストにチラシを配布する様子のイメージ" loading="lazy" decoding="async"><span>ポスティング</span></a>
          <a href="./works.html#carwash"><img src="./work-carwash.webp" width="1280" height="720" alt="泡を含ませたミットで車を手洗いする様子のイメージ" loading="lazy" decoding="async"><span>手洗い洗車</span></a>
        </div>
        <p class="photo-note">写真・映像は業務イメージです。</p>
        <div class="portfolio-links"><a href="./works.html"><span>仕事と作品をすべて見る</span></a><a href="./works.html#film"><svg class="icon" aria-hidden="true"><use href="#film"/></svg>紹介動画を見る</a></div>
      </section>
      <section class="contact" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">お問い合わせ</h2>
        <div class="contact-links"><a class="primary" href="mailto:ss526s-syr@yahoo.co.jp"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg>メールを送る</a><a href="./contact.html" data-add-contact><svg class="icon" aria-hidden="true"><use href="#add-person"/></svg>電話帳に登録</a></div>
      </section>
    </div>
  </main>
</body>
</html>
