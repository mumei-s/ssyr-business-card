<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16191e">
  <title>SHINJIの電話帳登録 | S's-YR</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/contact-import.css?v=direct-2">
  <script defer src="../assets/contact-import.js?v=direct-2"></script>
</head>
<body class="contact-page">
  <main class="contact-options" id="contact-options">
    <h1>電話帳に登録</h1>
    <p class="contact-name">SHINJI</p>
    <p class="contact-hint" id="fallback-hint">登録先を選び、内容を確かめて保存してください。</p>
    <nav class="contact-methods" aria-label="連絡先の登録方法">
      <a data-google-contact href="https://contacts.google.com/new?givenname=SHINJI&amp;email=ss526s-syr%40yahoo.co.jp" referrerpolicy="no-referrer">Google コンタクトで登録</a>
      <a data-apple-contact href="./contact.vcf" type="text/vcard">Appleの連絡先で開く</a>
    </nav>
    <p class="contact-note">Google コンタクトで保存した連絡先は、同じアカウントで連絡先の同期を有効にした端末に表示されます。</p>
    <dl class="contact-fields">
      <div><dt>名前</dt><dd>SHINJI</dd></div>
      <div><dt>屋号</dt><dd>S's-YR</dd></div>
      <div><dt>肩書</dt><dd>代表</dd></div>
      <div><dt>メール</dt><dd>ss526s-syr@yahoo.co.jp</dd></div>
    </dl>
    <p class="contact-note">端末の電話帳に手入力する場合は、上の項目を長押ししてコピーし、新しい連絡先に貼り付けてください。</p>
    <a class="contact-back" href="./">名刺に戻る</a>
  </main>
</body>
</html>
